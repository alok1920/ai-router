name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests before publishing
        run: npm test
        env:
          NODE_ENV: test
          GEMINI_API_KEY: test-key-not-real
          GROQ_API_KEY: test-key-not-real
          ANTHROPIC_API_KEY: test-key-not-real
          OPENAI_API_KEY: test-key-not-real

      - name: Fix package.json warnings
        run: npm pkg fix

      - name: Authenticate with npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_KEY }}

      - name: Check if version already published
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm show "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "✓ Version ${PKG_VERSION} already published — skipping"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${PKG_VERSION} not yet published — proceeding"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_KEY }}

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}